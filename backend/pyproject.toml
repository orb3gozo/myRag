[project]
name = "myrag"
version = "0.1.0"
description = "Local RAG for learning and experimenting with LLMs"
authors = [
    { name = "Orb3gozo", email = "orb3gozo@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.9.1",
    "lancedb>=0.41.0",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-fastembed>=0.7.0",
    "llama-index-embeddings-openai-like>=0.4.0",
    "llama-index-llms-openai-like>=0.8.1",
    "llama-index-vector-stores-lancedb>=0.6.0",
    "pydantic-settings>=2.16.3",
    "typer>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
myrag = "myrag.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FBT", "D", "C90", "SIM", "RET", "PTH"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
